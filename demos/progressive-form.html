<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Форма с HTML-in-Canvas</title>
<script defer src="../assets/cursors/idle.js"></script>
<link rel="stylesheet" href="../assets/cursors/cursors.css">
<style>
  :root {color-scheme: dark; font: 20px/1.4 system-ui, sans-serif}
  * {box-sizing: border-box}
  body {margin: 0; color: #f7f1df; background: #161922}
  main {width: min(100%, 720px); margin: auto; padding: 32px 24px}
  h1 {margin: 0 0 16px; font-size: clamp(30px, 6vw, 48px); line-height: 1.1; letter-spacing: -.04em}
  p {margin: 0 0 20px}
  form {display: grid; justify-items: start; gap: 16px; width: 100%; padding: 24px;
    border: 1px solid #546175; border-radius: 12px; background: #242a36}
  label {display: grid; gap: 6px; width: min(100%, 22rem)}
  input, button {max-width: 100%; border: 1px solid #68768b; border-radius: 6px;
    padding: 7px 12px; font: inherit}
  input {width: 100%; color: inherit; background: #161922}
  button {border-color: #c4f469; color: #16200c; background: #c4f469; font-weight: 650; cursor: pointer}
  :focus-visible {outline: 3px solid #ffbe70; outline-offset: 3px}
  canvas {display: block; width: 100%}
  #mode {margin-top: 16px; color: #bec2c7; font-size: 17px}
</style>
<main>
  <h1>Форма с HTML-in-Canvas</h1>
  <p>Введите имя. При отправке оно появится в параметре <code>name</code> в адресе страницы.</p>
  <form id="form" method="get">
    <label>Имя <input name="name" autocomplete="name" required></label>
    <button>Отправить</button>
  </form>
  <p id="mode" role="status">Режим: HTML</p>
</main>
<script>
  function enhanceForm() {
    const form = document.querySelector('#form');
    const mode = document.querySelector('#mode');
    const canvas = document.createElement('canvas');
    canvas.id = 'canvas';
    canvas.setAttribute('content', 'drawable');
    if (canvas.content !== 'drawable' || typeof canvas.requestPaint !== 'function') return;

    let ctx, resize, firstPaint;
    function useHtml() {
      clearTimeout(firstPaint);
      resize?.disconnect();
      canvas.onpaint = null;
      canvas.removeEventListener('contextlost', useHtml);
      if (form.parentNode === canvas) {
        const focused = document.activeElement;
        canvas.before(form);
        if (form.contains(focused)) focused.focus({preventScroll: true});
      }
      form.removeAttribute('drawable');
      canvas.remove();
      mode.textContent = 'Режим: HTML. Отрисовка в Canvas недоступна.';
    }

    function requestPaint() {
      try {
        const scale = window.devicePixelRatio || 1;
        const width = Math.round(form.offsetWidth * scale);
        const height = Math.round(form.offsetHeight * scale);
        if (canvas.width !== width) canvas.width = width;
        if (canvas.height !== height) canvas.height = height;
        canvas.requestPaint();
      } catch {
        useHtml();
      }
    }

    try {
      ctx = canvas.getContext('2d');
      if (typeof ctx?.drawElementImage !== 'function') return;

      canvas.onpaint = () => {
        try {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawElementImage(form, 0, 0, canvas.width, canvas.height);
          const scale = window.devicePixelRatio || 1;
          ctx.fillStyle = '#c4f469';
          ctx.fillRect(24 * scale, 0, 64 * scale, 3 * scale);
          if (firstPaint !== undefined) {
            clearTimeout(firstPaint);
            firstPaint = undefined;
            mode.textContent = 'Режим: Canvas 2D';
          }
        } catch {
          useHtml();
        }
      };
      canvas.addEventListener('contextlost', useHtml, {once: true});

      form.setAttribute('drawable', '');
      form.before(canvas);
      canvas.append(form);
      resize = new ResizeObserver(requestPaint);
      resize.observe(form);
      firstPaint = setTimeout(useHtml, 2500);
      requestPaint();
    } catch {
      useHtml();
    }
  }

  if (!new URLSearchParams(location.search).has('html')) enhanceForm();
</script>
</html>
