<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Билет в обсерваторию</title>
<script defer src="../assets/cursors/idle.js"></script><link rel="stylesheet" href="shared.css"><style>
html,body{width:100%;height:100%}body{background:#f1deb5;color:#222132}.ticket{position:relative;padding:22px 24px;height:100%;overflow:hidden}.stamp{position:absolute;right:23px;top:25px;width:41px;height:41px;border-radius:50%;background:repeating-linear-gradient(0deg,#9d393f 0 3px,transparent 3px 6px)}.ticket small{font:700 13px/1.1 ui-monospace,monospace;letter-spacing:.12em;color:#71403b}.ticket h2{font:700 34px/1.1 Georgia,serif;letter-spacing:-.04em;margin:17px 0 7px}.ticket p{font:17px/1.25 system-ui}.ticket button{position:absolute;bottom:21px;left:24px;background:#2f3542;border:0;color:#fff6d9;font-size:15px}.ticket button:focus-visible{outline-color:#913615}
</style><article class="ticket"><div class="stamp"></div><small>НОЧНОЙ СЕАНС</small><h2>Обсерватория</h2><p>21:30 · Восточная башня</p><button type="button">Взять билет</button></article><script>
const button=document.querySelector('button');button.addEventListener('click',()=>{const booked=button.textContent==='Взять билет';button.textContent=booked?'Вернуть билет':'Взять билет';document.querySelector('p').textContent=booked?'Место 07 · Билет у вас':'21:30 · Восточная башня';});
</script></html>
